dependencies:
  # PINNED de propósito: o conjunto abaixo é o que compilou/validou contra
  # ESP-IDF v5.5.1 neste projeto. Ranges (^) deixam o resolve saltar de
  # minor sem aviso — foi exatamente assim que Lua 5.5 e Slint 1.18
  # entraram e quebraram o build nas primeiras rodadas.
  # Ao atualizar qualquer um, atualize docs/DEPENDENCIAS.md.
  idf:
    version: ">=5.3,<6.0"   # IDF 6.x recusa P4 rev <3.1 (chip ES) — ver docs/HARDWARE.md

  # Driver do painel ST7701S via MIPI-DSI (série 1.x; a 2.x exige IDF 6.0+).
  espressif/esp_lcd_st7701:
    version: "==1.1.5"

  # Driver do touch GT911 (I2C).
  espressif/esp_lcd_touch_gt911:
    version: "==1.2.1"

  # Base do touch (transitiva do gt911 e do Slint); pinada p/ congelar.
  espressif/esp_lcd_touch:
    version: "==1.2.1"

  # Driver USB Host HID (teclado).
  espressif/usb_host_hid:
    version: "==1.2.1"

  # UI toolkit (prebuilt riscv32 p/ ESP-IDF).
  # PINNADO em 1.12.1 de propósito: o prebuilt 1.18.1 embute glifos de fonte
  # ~20x maiores (31,8 MiB de .rodata num app de ~3 MiB) e estoura o flash
  # de 16 MB. Ver docs/DEPENDENCIAS.md ("Regressão do Slint 1.18").
  slint/slint:
    version: "==1.12.1"

  # Sistema de arquivos interno.
  joltwallet/littlefs:
    version: "==1.22.3"

  # Lua 5.5 oficial da Espressif (scripts + config do sistema).
  espressif/lua:
    version: "==5.5.0"

  # Wi-Fi/BT via coprocessor C6 (SDIO). Par comprovado p/ esta placa:
  # host 2.12.9 + slave network_adapter 2.12.9 (ver tools/flash_c6_wifi.sh).
  espressif/esp_hosted:
    version: "==2.12.9"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_wifi_remote:
    version: ">=1.3.1"
    rules:
      - if: "target in [esp32p4]"
